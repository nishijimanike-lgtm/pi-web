[package]
name = "pi-web"
version = "0.9.1"
description = "Pi Web Desktop Application"
authors = ["agegr", "pi-web contributors"]
license = "MIT"
repository = "https://github.com/agegr/pi-web"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pi_web_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-log = "2"
open = "5.3"
